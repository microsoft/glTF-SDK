name: 'build windows'

on:
  workflow_call:
    inputs:
      cmake-version:
        required: true
        type: string
      platforms:
        required: true
        type: string
      configurations:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    env:
      # CMake 4.x removed compatibility with cmake_minimum_required(VERSION < 3.5).
      # The vendored RapidJSON source (downloaded at configure time) still declares an
      # older minimum, so clamp the policy version for its nested/child configures.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
        matrix:
            platform: ${{ fromJson(inputs.platforms) }}
            config: ${{ fromJson(inputs.configurations) }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
            submodules: 'true'
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
            cmake-version: ${{ inputs.cmake-version }}
      - name: CMake Configure
        run: cmake -G "Visual Studio 18 2026" -A ${{ matrix.platform }} -B ./Built/Int/cmake_${{ matrix.platform }} .
      - name: CMake Build
        run: cmake --build . --target install --config ${{ matrix.config }}
        working-directory: ./Built/Int/cmake_${{ matrix.platform }}
      - name: Running Unit Tests
        if: ${{ (matrix.platform == 'x64') || (matrix.platform == 'Win32') }}
        run: .\GLTFSDK.Test.exe --gtest_output=xml:GLTFSDK.Test.log
        working-directory: ./Built/Out/windows_${{ matrix.platform }}\${{ matrix.config }}\GLTFSDK.Test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        name: "Upload test results"
        if: ${{ (matrix.platform == 'x64') || (matrix.platform == 'Win32') }}
        with:
            name: GLTFSDK.Test.Windows.${{ matrix.platform }}.${{ matrix.config }}
            path: ${{ github.workspace }}\Built\Out\windows_${{ matrix.platform }}\${{ matrix.config }}\GLTFSDK.Test\GLTFSDK.Test.log