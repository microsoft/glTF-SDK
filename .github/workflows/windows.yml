name: 'build windows'

on:
  workflow_call:
    inputs:
      cmake-version:
        required: true
        type: string
      platforms:
        required: true
        type: string
      configurations:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
        config: ${{ fromJson(inputs.configurations) }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ inputs.cmake-version }}

      - name: Offline dependency configure
        shell: pwsh
        run: |
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'
          cmake -S . `
            -B "./Built/Int/offline_${{ matrix.platform }}_${{ matrix.config }}" `
            -G "Visual Studio 18 2026" `
            -A "${{ matrix.platform }}" `
            -DENABLE_UNIT_TESTS=OFF `
            -DENABLE_SAMPLES=OFF `
            -DENABLE_BENCHMARKS=OFF

      - name: CMake Configure
        run: >
          cmake -S . -B "./Built/Int/cmake_${{ matrix.platform }}_${{ matrix.config }}"
          -G "Visual Studio 18 2026"
          -A "${{ matrix.platform }}"
          -DENABLE_SAMPLES=OFF

      - name: CMake Build and Install
        run: >
          cmake --build "./Built/Int/cmake_${{ matrix.platform }}_${{ matrix.config }}"
          --target install
          --config "${{ matrix.config }}"
          --parallel

      - name: Running Unit Tests
        if: ${{ matrix.platform == 'x64' || matrix.platform == 'Win32' }}
        run: >
          .\GLTFSDK.Test.exe
          --gtest_output=xml:GLTFSDK.Test.log
        working-directory: ./Built/Out/windows_${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK.Test

      - name: Configure Installed Consumer
        run: >
          cmake -S ./GLTFSDK.PublicConsumer.Test
          -B "./Built/Int/consumer_${{ matrix.platform }}_${{ matrix.config }}"
          -G "Visual Studio 18 2026"
          -A "${{ matrix.platform }}"
          -DGLTFSDK_ROOT="${{ github.workspace }}/Built/Out/windows_${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK"

      - name: Build Installed Consumer
        run: >
          cmake --build "./Built/Int/consumer_${{ matrix.platform }}_${{ matrix.config }}"
          --config "${{ matrix.config }}"
          --parallel

      - name: Run Installed Consumer
        if: ${{ matrix.platform == 'x64' || matrix.platform == 'Win32' }}
        run: >
          & "./Built/Int/consumer_${{ matrix.platform }}_${{ matrix.config }}/${{ matrix.config }}/GLTFSDK.PublicConsumer.Test.exe"
        shell: pwsh

      - name: Verify Installed Package
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}/Built/Out/windows_${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK"
          $legacyVendor = 'rapid' + 'json'
          $legacyHeader = 'Rapid' + 'JsonUtils'
          $matches = Get-ChildItem "$root/Inc" -Recurse -File |
            Select-String -Pattern "$legacyVendor|nlohmann|valijson"
          if ($matches) {
            $matches | Write-Output
            throw 'Installed public headers expose a JSON vendor'
          }
          $privateFiles = Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Name -match "json\.hpp|json_fwd\.hpp|$legacyHeader|$legacyVendor" -or
              ($_.FullName -match '[\\/]valijson[\\/]' -and $_.Name -notmatch 'LICENSE')
            }
          if ($privateFiles) {
            $privateFiles | Write-Output
            throw 'Installed package contains private dependency files'
          }
          Get-ChildItem $root -Recurse -File |
            ForEach-Object { $_.FullName.Substring($root.Length + 1) } |
            Set-Content "./Built/Int/package_${{ matrix.platform }}_${{ matrix.config }}.txt"

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GLTFSDK.Windows.${{ matrix.platform }}.${{ matrix.config }}
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/Built/Out/windows_${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK.Test/GLTFSDK.Test.log
            ${{ github.workspace }}/Built/Int/package_${{ matrix.platform }}_${{ matrix.config }}.txt
