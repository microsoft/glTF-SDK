name: 'build android'

on:
  workflow_call:
    inputs:
      cmake-version:
        required: true
        type: string
      platforms:
        required: true
        type: string
      configurations:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
        config: ${{ fromJson(inputs.configurations) }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: ${{ inputs.cmake-version }}

      - name: Offline CMake Configure
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          cmake -S .
          -B "./Built/Int/cmake_android_${{ matrix.platform }}_${{ matrix.config }}"
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DANDROID_ABI="${{ matrix.platform }}"
          -DANDROID_PLATFORM=android-24
          -DANDROID_OS_PLATFORM=ANDROID
          -DENABLE_UNIT_TESTS=OFF
          -DENABLE_SAMPLES=OFF
          -DENABLE_BENCHMARKS=OFF

      - name: CMake Build and Install
        run: >
          cmake --build "./Built/Int/cmake_android_${{ matrix.platform }}_${{ matrix.config }}"
          --target install
          --config "${{ matrix.config }}"
          --parallel

      - name: Verify Installed Package
        run: |
          root="${{ github.workspace }}/Built/Out/android_${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK"
          legacy_vendor='rapid''json'
          if grep -RniE "${legacy_vendor}|nlohmann|valijson" "$root/Inc"; then
            echo "Installed public headers expose a JSON vendor"
            exit 1
          fi
          find "$root" -type f -printf '%P\n' | sort > "./Built/Int/package_android_${{ matrix.platform }}_${{ matrix.config }}.txt"

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GLTFSDK.Android.${{ matrix.platform }}.${{ matrix.config }}
          if-no-files-found: ignore
          path: ${{ github.workspace }}/Built/Int/package_android_${{ matrix.platform }}_${{ matrix.config }}.txt
