name: 'sanitizer tests'

on:
  workflow_call:
    inputs:
      cmake-version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ inputs.cmake-version }}

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld

      - name: Offline dependency configure
        env:
          CC: clang
          CXX: clang++
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          cmake -S .
          -B ./Built/Int/cmake_Linux_Offline
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_UNIT_TESTS=OFF
          -DENABLE_SAMPLES=OFF
          -DENABLE_BENCHMARKS=OFF

      - name: CMake Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S .
          -B ./Built/Int/cmake_Linux_Sanitizer
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          -DENABLE_SAMPLES=OFF

      - name: CMake Build and Install
        run: >
          cmake --build ./Built/Int/cmake_Linux_Sanitizer
          --target install
          --config Debug
          --parallel

      - name: Running Full Sanitizer Suite
        run: >
          ./GLTFSDK.Test
          --gtest_output=xml:GLTFSDK.Test.Sanitizer.log
        working-directory: ./Built/Out/Linux/Debug/GLTFSDK.Test
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

      - name: Running Malformed and Deep Sanitizer Suite
        run: >
          ./GLTFSDK.Test
          --gtest_filter=JsonTests.Strict*:JsonTests.Pointer*:GLTFTests.StrictPublic*:DeserializeTests.DeserializeFail*
          --gtest_output=xml:GLTFSDK.Test.Sanitizer.Malformed.log
        working-directory: ./Built/Out/Linux/Debug/GLTFSDK.Test
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

      - name: Upload sanitizer results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GLTFSDK.Sanitizer
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/Built/Out/Linux/Debug/GLTFSDK.Test/GLTFSDK.Test.Sanitizer.log
            ${{ github.workspace }}/Built/Out/Linux/Debug/GLTFSDK.Test/GLTFSDK.Test.Sanitizer.Malformed.log
