name: 'build linux'

on:
  workflow_call:
    inputs:
      cmake-version:
        required: true
        type: string
      platforms:
        required: true
        type: string
      configurations:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
        config: ${{ fromJson(inputs.configurations) }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: ${{ inputs.cmake-version }}

      - name: Offline dependency configure
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          cmake -S .
          -B "./Built/Int/offline_${{ matrix.platform }}_${{ matrix.config }}"
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DENABLE_UNIT_TESTS=OFF
          -DENABLE_SAMPLES=OFF
          -DENABLE_BENCHMARKS=OFF

      - name: CMake Configure
        run: >
          cmake -S .
          -B "./Built/Int/cmake_${{ matrix.platform }}_${{ matrix.config }}"
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DENABLE_SAMPLES=OFF

      - name: CMake Build and Install
        run: >
          cmake --build "./Built/Int/cmake_${{ matrix.platform }}_${{ matrix.config }}"
          --target install
          --config "${{ matrix.config }}"
          --parallel

      - name: Running Unit Tests
        run: |
          set +e
          ./GLTFSDK.Test --gtest_output=xml:GLTFSDK.Test.log
          status=$?
          if [ "$status" -ne 0 ] && [ "${{ matrix.config }}" = "RelWithDebInfo" ]; then
            if ! command -v gdb >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y gdb
            fi
            gdb --batch \
              -ex "set pagination off" \
              -ex run \
              -ex "thread apply all bt full" \
              --args ./GLTFSDK.Test \
              --gtest_filter=DeserializeTests.ValidationSuccess_ValidPrimitiveNoIndices__none
          fi
          exit "$status"
        working-directory: ./Built/Out/${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK.Test

      - name: Configure Installed Consumer
        run: >
          cmake -S ./GLTFSDK.PublicConsumer.Test
          -B "./Built/Int/consumer_${{ matrix.platform }}_${{ matrix.config }}"
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DGLTFSDK_ROOT="${{ github.workspace }}/Built/Out/${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK"

      - name: Build and Run Installed Consumer
        run: |
          cmake --build "./Built/Int/consumer_${{ matrix.platform }}_${{ matrix.config }}" --parallel
          "./Built/Int/consumer_${{ matrix.platform }}_${{ matrix.config }}/GLTFSDK.PublicConsumer.Test"

      - name: Verify Installed Package
        run: |
          root="${{ github.workspace }}/Built/Out/${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK"
          legacy_vendor='rapid''json'
          legacy_header='Rapid''JsonUtils'
          if grep -RniE "${legacy_vendor}|nlohmann|valijson" "$root/Inc"; then
            echo "Installed public headers expose a JSON vendor"
            exit 1
          fi
          if find "$root" -type f \( -name 'json.hpp' -o -name 'json_fwd.hpp' -o -name "${legacy_header}.h" \) | grep -q .; then
            echo "Installed package contains private dependency files"
            exit 1
          fi
          find "$root" -type f -printf '%P\n' | sort > "./Built/Int/package_${{ matrix.platform }}_${{ matrix.config }}.txt"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GLTFSDK.Linux.${{ matrix.platform }}.${{ matrix.config }}
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/Built/Out/${{ matrix.platform }}/${{ matrix.config }}/GLTFSDK.Test/GLTFSDK.Test.log
            ${{ github.workspace }}/Built/Int/package_${{ matrix.platform }}_${{ matrix.config }}.txt
