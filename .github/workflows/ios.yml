name: 'build ios'

on:
  workflow_call:
    inputs:
      cmake-version:
        required: true
        type: string
      platforms:
        required: true
        type: string
      configurations:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
        config: ${{ fromJson(inputs.configurations) }}
    env:
      OUTPUT_PLATFORM: ${{ matrix.platform == 'OS' && 'iOS' || 'iOSSimulator64' }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: ${{ inputs.cmake-version }}

      - name: Offline CMake Configure
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          cmake -S .
          -B "./Built/Int/cmake_iOS_${{ matrix.platform }}_${{ matrix.config }}"
          -G Xcode
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/Build/CMake/ios.toolchain.cmake"
          -DIOS_PLATFORM="${{ matrix.platform }}"
          -DDEPLOYMENT_TARGET="10.11"
          -DENABLE_UNIT_TESTS=OFF
          -DENABLE_SAMPLES=OFF
          -DENABLE_BENCHMARKS=OFF

      - name: CMake Build and Install
        run: >
          cmake --build "./Built/Int/cmake_iOS_${{ matrix.platform }}_${{ matrix.config }}"
          --target install
          --config "${{ matrix.config }}"
          --parallel

      - name: Verify Installed Package
        run: |
          root="${{ github.workspace }}/Built/Out/${OUTPUT_PLATFORM}/${{ matrix.config }}/GLTFSDK"
          legacy_vendor='rapid''json'
          if grep -RniE "${legacy_vendor}|nlohmann|valijson" "$root/Inc"; then
            echo "Installed public headers expose a JSON vendor"
            exit 1
          fi
          find "$root" -type f | sed "s#^$root/##" | sort > "./Built/Int/package_iOS_${{ matrix.platform }}_${{ matrix.config }}.txt"

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GLTFSDK.iOS.${{ matrix.platform }}.${{ matrix.config }}
          if-no-files-found: ignore
          path: ${{ github.workspace }}/Built/Int/package_iOS_${{ matrix.platform }}_${{ matrix.config }}.txt
