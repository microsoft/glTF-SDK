name: 'build ios'

on:
  workflow_call:
    inputs:
      cmake-version:
        required: true
        type: string
      platforms:
        required: true
        type: string
      configurations:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    strategy:
        matrix:
            platform: ${{ fromJson(inputs.platforms) }}
            config: ${{ fromJson(inputs.configurations) }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            submodules: 'true'
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
            cmake-version: ${{ inputs.cmake-version }}
      - name: CMake Configure
        run: cmake -G Xcode -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/Build/CMake/ios.toolchain.cmake" -DPLATFORM=OS -DDEPLOYMENT_TARGET="10.11" -DENABLE_UNIT_TESTS="OFF" -B ./Built/Int/cmake_${{ matrix.platform }} .
      - name: CMake Build
        run: cmake --build . --target install --config ${{ matrix.config }}
        working-directory: ./Built/Int/cmake_${{ matrix.platform }}